<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA 6-style Cover Art Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">&#9733;</span>
    <div>
      <strong>VICE COVER STUDIO</strong>
      <span class="brand-sub">GTA 6-style multi-panel cover art maker</span>
    </div>
  </div>
  <div class="top-actions">
    <button id="undo" type="button" title="Undo (Ctrl+Z)">&#8617; Undo</button>
    <button id="export" type="button" class="primary">Export PNG</button>
  </div>
</header>
<main class="app">
  <aside class="controls" aria-label="Cover controls">
    <section>
      <h2>Layout</h2>
      <div id="layouts" class="chips" role="group" aria-label="Layout"></div>
    </section>
    <section>
      <h2>Colour grade</h2>
      <div id="grades" class="swatches" role="group" aria-label="Colour grade"></div>
    </section>
    <section>
      <h2>Title</h2>
      <label>Big title <input id="title" type="text" maxlength="24" value="VICE CITY"></label>
      <label>Script subtitle <input id="subtitle" type="text" maxlength="32" value="Neon Nights"></label>
      <label>Quote <input id="quote" type="text" maxlength="90" value="The city never sleeps, and neither do we."></label>
      <label>Stars <span class="range-row"><input id="stars" type="range" min="0" max="5" step="1" value="5"><output id="starsOut">5 / 5</output></span></label>
      <label>Volume <input id="vol" type="text" maxlength="12" value="VOL. 06"></label>
    </section>
    <section>
      <h2>Badges</h2>
      <label class="check"><input id="wanted" type="checkbox" checked> WANTED pill</label>
      <label class="check"><input id="seal" type="checkbox" checked> Gold seal badge</label>
      <label class="check"><input id="strip" type="checkbox" checked> Collector ribbon + bottom strip</label>
    </section>
    <section>
      <h2>Selected panel</h2>
      <p id="panelLabel" class="panel-label">Panel 1 of 3</p>
      <div id="thumbs" class="thumbs" role="group" aria-label="Sample photos"></div>
      <label class="upload-btn">Upload your own photo
        <input id="upload" type="file" accept="image/*" hidden>
      </label>
      <label>Zoom <span class="range-row"><input id="zoom" type="range" min="0" max="300" step="1" value="0"><output id="zoomOut">100%</output></span></label>
      <button id="resetCrop" type="button">Reset crop</button>
      <p class="hint">Click a panel to select it. Drag a panel to move the photo, scroll to zoom.</p>
    </section>
    <section>
      <h2>Export size</h2>
      <select id="exportSize" aria-label="Export size"></select>
    </section>
    <p id="status" role="status"></p>
    <p id="selftest" class="selftest" role="status"></p>
  </aside>
  <section class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
    <p class="stage-hint">Live preview &mdash; what you see is the exported cover.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
